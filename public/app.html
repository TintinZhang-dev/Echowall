<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, #1d9bf0 0%, #0b6bbd 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; color: #1f2937;
    }
    .card {
      background: #fff; border-radius: 20px; padding: 32px 28px;
      max-width: 420px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.25);
      text-align: center;
    }
    .logo {
      width: 88px; height: 88px; border-radius: 22px; margin: 0 auto 16px;
      background: #1d9bf0; display: flex; align-items: center; justify-content: center;
      font-size: 52px; font-weight: 800; color: #fff; box-shadow: 0 8px 24px rgba(29,155,240,.4);
    }
    h1 { font-size: 22px; margin-bottom: 4px; }
    .sub { color: #6b7280; font-size: 13px; margin-bottom: 20px; }
    .meta {
      display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 22px;
    }
    .badge {
      background: #eff6ff; color: #1d4ed8; border-radius: 999px; padding: 4px 12px;
      font-size: 12px; font-weight: 600;
    }
    .dl-btn {
      display: block; background: #1d9bf0; color: #fff; text-decoration: none;
      padding: 14px 0; border-radius: 12px; font-size: 17px; font-weight: 700;
      margin-bottom: 8px; transition: background .15s;
    }
    .dl-btn:hover { background: #0b6bbd; }
    .dl-note { font-size: 12px; color: #9ca3af; margin-bottom: 24px; }
    .steps {
      text-align: left; background: #f9fafb; border-radius: 12px; padding: 16px 18px;
    }
    .steps h3 { font-size: 14px; color: #374151; margin-bottom: 10px; }
    .steps ol { padding-left: 20px; font-size: 13px; color: #4b5563; line-height: 1.9; }
    .back { display: inline-block; margin-top: 18px; color: #6b7280; font-size: 13px; text-decoration: none; }
    .back:hover { color: #1d9bf0; }
  </style>
</head>
<body>
  <div class="card">

<script src="/js/site.js?v=202609130948"></script>
