<!DOCTYPE html>
<html lang="zh">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1d9bf0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>诊断 Diag</title>
<style>body{font-family:monospace;padding:16px;background:#111;color:#0f0;font-size:14px;word-break:break-all}pre{white-space:pre-wrap}</style>
</head>
<body>
<pre id="out">加载中...</pre>
<script>
const out = [];
function log(s){ out.push(new Date().toISOString().slice(11,19) + ' ' + s); document.getElementById('out').textContent = out.join('\n'); }
window.addEventListener('error', e => log('ERROR: ' + e.message + ' @' + (e.filename || 'inline') + ':' + e.lineno));
window.addEventListener('unhandledrejection', e => log('PROMISE: ' + String(e.reason).slice(0,200)));
log('UA: ' + navigator.userAgent);
log('readyState: ' + document.readyState);
log('JS sync: OK');
setTimeout(function(){ log('JS timer(2s): OK'); }, 2000);
fetch('/api/posts?page=1&limit=1')
  .then(function(r){ return r.json().then(function(d){ log('API /api/posts: ' + r.status + ' posts=' + (d.posts ? d.posts.length : 'none') + ' total=' + d.total); }); })
  .catch(function(e){ log('API FAIL: ' + e.message); });
fetch('/api/debug', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({msg:'DIAG_PAGE_OPENED', ua: navigator.userAgent})}).catch(function(){});
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{});});}</script>
</body>
</html>
