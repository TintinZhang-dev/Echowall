<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1d9bf0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title data-site-title="私信|brand.logoText">私信 — Phewall</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css?v=202609060208">
  <style>
    .dm-page {
      max-width: 800px;
      margin: 0 auto;
      padding-top: calc(56px + env(safe-area-inset-top));
      padding-bottom: env(safe-area-inset-bottom);
      height: 100vh;
      display: flex;
    }
    /* Conversation list panel */
    .dm-conv-panel {
      width: 320px;
      min-width: 280px;
      border-right: 1px solid var(--border);
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .dm-conv-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .dm-conv-header h2 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 800;
    }
    .dm-back {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--text);
      padding: 4px 8px;
      border-radius: 50%;
    }
    .dm-back:hover { background: var(--bg-secondary); }
    .dm-conv-list {
      flex: 1;
      overflow-y: auto;
    }
    .dm-conv-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .dm-conv-item:hover { background: var(--bg-secondary); }
    .dm-conv-item.active { background: rgba(29,155,240,0.06); }
    .dm-conv-avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .dm-conv-info { flex: 1; min-width: 0; }
    .dm-conv-name {
      font-weight: 700;
      font-size: 0.93rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dm-conv-school {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 400;
    }
    .dm-conv-preview {
      font-size: 0.82rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .dm-conv-meta {
      text-align: right;
      flex-shrink: 0;
    }
    .dm-conv-time {
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .dm-conv-badge {
      display: inline-block;
      background: var(--danger);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      min-width: 18px;
      height: 18px;
      line-height: 18px;
      text-align: center;
      border-radius: 9px;
      padding: 0 5px;
      margin-top: 4px;
    }
    .dm-conv-empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Chat panel */
    .dm-chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      overflow: hidden;
    }
    .dm-chat-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .dm-chat-header .dm-back { display: none; }
    .dm-chat-name {
      font-weight: 700;
      font-size: 1rem;
    }
    .dm-chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .dm-msg-row {
      display: flex;
      gap: 8px;
      max-width: 80%;
    }
    .dm-msg-row.mine {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .dm-msg-row.theirs {
      align-self: flex-start;
    }
    .dm-msg-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.75rem;
      flex-shrink: 0;
    }
    .dm-msg-bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 0.9rem;
      line-height: 1.4;
      word-break: break-word;
    }
    .dm-msg-row.mine .dm-msg-bubble {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .dm-msg-row.theirs .dm-msg-bubble {
      background: var(--bg-secondary);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }
    .dm-msg-time {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 2px;
      text-align: center;
    }
    .dm-msg-date-divider {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin: 8px 0;
    }
    .dm-msg-date-divider span {
      background: var(--bg-secondary);
      padding: 4px 12px;
      border-radius: 10px;
    }

    /* Input area */
    .dm-chat-input {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .dm-chat-input input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 10px 16px;
      font-size: 0.9rem;
      font-family: inherit;
      background: var(--bg-secondary);
      color: var(--text);
      outline: none;
    }
    .dm-chat-input input:focus { border-color: var(--accent); }
    .dm-chat-input button {
      padding: 8px 18px;
      border-radius: 20px;
      border: none;
      background: var(--text);
      color: #fff;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      flex-shrink: 0;
    }
    .dm-chat-input button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    .dm-chat-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .dm-error {
      text-align: center;
      padding: 20px;
      color: var(--danger);
      font-size: 0.85rem;
    }

    /* Loading */
    .dm-loading {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* Mobile responsive */
    @media (max-width: 600px) {
      .dm-page {
        flex-direction: column;
        padding-top: 0;
      }
      .dm-conv-panel {
        width: 100%;
        min-width: 0;
        border-right: none;
        display: flex;
      }
      .dm-conv-panel.full { display: flex; }
      .dm-conv-panel.hidden { display: none; }
      .dm-chat-panel { display: none; }
      .dm-chat-panel.active { display: flex; }
      .dm-chat-header .dm-back { display: block; }
      .dm-msg-row { max-width: 90%; }
    }
  </style>
</head>
<body>
  <div class="dm-page">
    <!-- Conversation list -->
    <div class="dm-conv-panel" id="conv-panel">
      <div class="dm-conv-header">
        <button class="dm-back" onclick="history.back()">←</button>
        <h2>✉️ 私信</h2>
      </div>
      <div class="dm-conv-list" id="conv-list">
        <div class="dm-loading">加载中...</div>
      </div>
    </div>

    <!-- Chat panel -->
    <div class="dm-chat-panel" id="chat-panel">
      <div class="dm-chat-header">
        <button class="dm-back" onclick="closeChat()">←</button>
        <span class="dm-chat-name" id="chat-name">私信</span>
      </div>
      <div class="dm-chat-messages" id="chat-messages">
        <div class="dm-chat-empty">选择一个会话开始聊天</div>
      </div>
      <div class="dm-chat-input" id="chat-input" style="display:none;">
        <input type="text" id="msg-input" placeholder="输入消息..." maxlength="2000" onkeydown="if(event.key==='Enter')sendMessage()">
        <button onclick="sendMessage()" id="send-btn">发送</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" style="display:none;"></div>
  <style>
    .toast {
      position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
      background: var(--card-bg); color: var(--text); padding: 10px 24px;
      border-radius: 20px; font-size: 0.9rem; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      z-index: 400; border: 1px solid var(--border); white-space: nowrap;
    }
    .toast.error { border-color: rgba(244,33,46,0.4); color: var(--danger); }
    .toast.success { border-color: rgba(0,186,124,0.4); color: var(--success); }
  </style>

  <script>
    let currentUser = null;
    let conversations = [];
    let activePartnerId = null;
    let messages = [];
    let convPollTimer = null;
    let msgPollTimer = null;

    // [2026-08-31] 修复：stopMsgPoll 被调用但从未定义（WebView 里持续报 ReferenceError）
    function stopMsgPoll() {
      if (msgPollTimer) { clearInterval(msgPollTimer); msgPollTimer = null; }
    }

    function authHeaders() { return {}; }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatTime(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr + 'Z');
      const now = new Date();
      const diff = now - date;
      if (diff < 60000) return '刚刚';
      if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
      if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
      if (diff < 604800000) return Math.floor(diff / 86400000) + ' 天前';
      return dateStr.substring(0, 10);
    }

    function formatChatTime(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr + 'Z');
      const h = String(date.getHours()).padStart(2, '0');
      const m = String(date.getMinutes()).padStart(2, '0');
      return h + ':' + m;
    }

    function avatarHtml(user) {
      if (user && user.avatar_type === 'custom' && user.avatar_url) {
        return '<img src="' + escapeHtml(user.avatar_url) + '" class="avatar-img" alt="">';
      }
      const displayName = user ? (user.nickname || user.name) : '';
      const initial = displayName ? displayName[0] : '?';
      return '<span class="avatar-circle avatar-initials">' + escapeHtml(initial) + '</span>';
    }

    function showToast(msg, type) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast' + (type ? ' ' + type : '');
      toast.style.display = 'block';
      clearTimeout(toast._timeout);
      toast._timeout = setTimeout(function() { toast.style.display = 'none'; }, 2500);
    }

    // ===== Init =====
    async function initDmPage() {
      await checkAuth();
      if (!currentUser) {
        document.getElementById('conv-list').innerHTML = '<div class="dm-conv-empty">请先<a href="/login" style="color:var(--accent);">登录</a></div>';
        return;
      }
      await loadConversations();
      startConvPoll();

      // Auto-open chat if ?user= param is present
      var params = new URLSearchParams(window.location.search);
      var uid = parseInt(params.get('user'));
      if (uid) {
        openChat(uid);
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initDmPage);
    } else {
      initDmPage();
    }

    async function checkAuth() {
      try {
        var res = await fetch('/api/auth/me', { headers: authHeaders() });
        if (res.ok) {
          var data = await res.json();
          currentUser = data.user;
        }
      } catch(e) {}
    }

    // ===== Conversations =====
    async function loadConversations() {
      try {
        var res = await fetch('/api/dm/conversations', { headers: authHeaders() });
        if (!res.ok) {
          document.getElementById('conv-list').innerHTML = '<div class="dm-error">加载失败</div>';
          return;
        }
        var data = await res.json();
        conversations = data.conversations || [];
        renderConversations();
      } catch(e) {
        document.getElementById('conv-list').innerHTML = '<div class="dm-error">加载失败</div>';
      }
    }

    function renderConversations() {
      var list = document.getElementById('conv-list');
      if (conversations.length === 0) {
        list.innerHTML = '<div class="dm-conv-empty">暂无会话</div>';
        return;
      }
      list.innerHTML = conversations.map(function(c) {
        var u = c.user;
        var activeClass = (activePartnerId === u.id) ? ' active' : '';
        var badge = c.unread_count > 0 ? '<div class="dm-conv-badge">' + (c.unread_count > 99 ? '99+' : c.unread_count) + '</div>' : '';
        var preview = c.last_message ? escapeHtml(c.last_message) : '暂无消息';
        var school = u.is_external && u.school ? '<span class="dm-conv-school">' + escapeHtml(u.school) + '</span>' : '';
        return '<div class="dm-conv-item' + activeClass + '" onclick="openChat(' + u.id + ')">' +
          '<div class="dm-conv-avatar" style="overflow:hidden;">' + avatarHtml(u) + '</div>' +
          '<div class="dm-conv-info">' +
            '<div class="dm-conv-name">' + escapeHtml(u.nickname || u.name) + school + '</div>' +
            '<div class="dm-conv-preview">' + preview + '</div>' +
          '</div>' +
          '<div class="dm-conv-meta">' +
            '<div class="dm-conv-time">' + formatTime(c.last_message_at) + '</div>' +
            badge +
          '</div>' +
        '</div>';
      }).join('');
    }

    function startConvPoll() {
      stopConvPoll();
      convPollTimer = setInterval(function() {
        loadConversations();
      }, 20000);
    }

    function stopConvPoll() {
      if (convPollTimer) { clearInterval(convPollTimer); convPollTimer = null; }
    }

    // ===== Chat =====
    async function openChat(partnerId) {
      activePartnerId = partnerId;
      messages = [];
      document.getElementById('chat-messages').innerHTML = '<div class="dm-loading">加载中...</div>';
      document.getElementById('chat-input').style.display = 'none';
      document.getElementById('chat-name').textContent = '加载中...';

      // Update active state in conversation list
      renderConversations();

      // Mobile: show chat panel
      document.getElementById('conv-panel').classList.add('hidden');
      document.getElementById('chat-panel').classList.add('active');

      await loadMessages();

      // Start message polling (5s)
      stopMsgPoll();
      msgPollTimer = setInterval(function() {
        loadMessages(true);
      }, 5000);
    }

    async function loadMessages(silent) {
      if (!activePartnerId) return;
      try {
        var res = await fetch('/api/dm/' + activePartnerId + '/messages', { headers: authHeaders() });
        if (!res.ok) {
          if (!silent) {
            document.getElementById('chat-messages').innerHTML = '<div class="dm-error">加载聊天记录失败</div>';
          }
          return;
        }
        var data = await res.json();
        messages = data.messages || [];

        // Update chat header with partner name
        var conv = null;
        for (var i = 0; i < conversations.length; i++) {
          if (conversations[i].user.id === activePartnerId) { conv = conversations[i]; break; }
        }
        if (conv) {
          document.getElementById('chat-name').textContent = conv.user.nickname || conv.user.name;
        }

        renderMessages();
        document.getElementById('chat-input').style.display = 'flex';

        // Auto-scroll to bottom
        var msgEl = document.getElementById('chat-messages');
        msgEl.scrollTop = msgEl.scrollHeight;

        // Refresh conversations to update unread counts
        if (silent !== false) {
          loadConversations();
        }
      } catch(e) {
        if (!silent) {
          document.getElementById('chat-messages').innerHTML = '<div class="dm-error">加载聊天记录失败</div>';
        }
      }
    }

    function renderMessages() {
      var container = document.getElementById('chat-messages');
      if (messages.length === 0) {
        container.innerHTML = '<div class="dm-chat-empty">暂无消息，发送第一条吧</div>';
        return;
      }

      // Build message list with date dividers
      var html = '';
      var lastDate = '';
      for (var i = 0; i < messages.length; i++) {
        var m = messages[i];
        var msgDate = (m.created_at || '').substring(0, 10);
        if (msgDate !== lastDate) {
          lastDate = msgDate;
          html += '<div class="dm-msg-date-divider"><span>' + msgDate + '</span></div>';
        }

        var isMine = m.sender_id === currentUser.id;
        var cls = isMine ? 'mine' : 'theirs';
        var avatarSrc = '';
        if (isMine) {
          avatarSrc = avatarHtml(currentUser);
        } else {
          var partner = null;
          for (var j = 0; j < conversations.length; j++) {
            if (conversations[j].user.id === activePartnerId) { partner = conversations[j].user; break; }
          }
          avatarSrc = avatarHtml(partner);
        }

        html += '<div class="dm-msg-row ' + cls + '">' +
          '<div class="dm-msg-avatar" style="overflow:hidden;">' + avatarSrc + '</div>' +
          '<div>' +
            '<div class="dm-msg-bubble">' + escapeHtml(m.content) + '</div>' +
            '<div class="dm-msg-time">' + formatChatTime(m.created_at) + '</div>' +
          '</div>' +
        '</div>';
      }
      container.innerHTML = html;
    }

    function closeChat() {
      activePartnerId = null;
      messages = [];
      stopMsgPoll();
      document.getElementById('chat-messages').innerHTML = '<div class="dm-chat-empty">选择一个会话开始聊天</div>';
      document.getElementById('chat-input').style.display = 'none';
      document.getElementById('chat-name').textContent = '私信';

      // Mobile: show conv panel
      document.getElementById('conv-panel').classList.remove('hidden');
      document.getElementById('chat-panel').classList.remove('active');

      // Refresh conversations to show updated unread counts
      loadConversations();
      renderConversations();
    }

    async function sendMessage() {
      if (!activePartnerId) return;
      var input = document.getElementById('msg-input');
      var btn = document.getElementById('send-btn');
      var content = input.value.trim();
      if (!content) return;

      if (content.length > 2000) {
        showToast('消息内容不能超过 2000 字', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = '发送中...';

      try {
        var res = await fetch('/api/dm/' + activePartnerId, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders() },
          body: JSON.stringify({ content: content })
        });
        if (!res.ok) {
          var err = await res.json();
          showToast(err.error || '发送失败', 'error');
          btn.disabled = false;
          btn.textContent = '发送';
          return;
        }
        input.value = '';
        // Reload messages
        await loadMessages();
      } catch(e) {
        showToast('网络错误，请重试', 'error');
      }

      btn.disabled = false;
      btn.textContent = '发送';
    }

    // Stop polls on page unload
    window.addEventListener('beforeunload', function() {
      stopConvPoll();
      stopMsgPoll();
    });

    // Visibility change: pause/resume polls
    document.addEventListener('visibilitychange', function() {
      if (document.hidden) {
        stopConvPoll();
        stopMsgPoll();
      } else {
        if (currentUser) {
          startConvPoll();
          if (activePartnerId) {
            msgPollTimer = setInterval(function() { loadMessages(true); }, 5000);
          }
          loadConversations();
        }
      }
    });
  </script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{});});}</script>
<script src="/js/site.js?v=202609120000"></script>
</body>
</html>
