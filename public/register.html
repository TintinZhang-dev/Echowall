<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1d9bf0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>注册 — Phewall</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css?v=202609060208">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>✨ 注册 Phewall</h1>
    <p class="auth-subtitle">加入 Phewall 社区</p>

    <div id="internal-fields">
    <div class="form-row">
      <div class="form-col">
        <label class="form-label">届 <span class="form-required">*</span></label>
        <input type="number" id="year" class="form-input" placeholder="如 29（高考年份）" min="1" max="99" autocomplete="off">
      </div>
      <div class="form-col">
        <label class="form-label">班级 <span class="form-hint">（可选）</span></label>
        <input type="number" id="class_number" class="form-input" placeholder="如 7（可选）" min="0" max="99" autocomplete="off">
    <p style="color:var(--danger);font-size:0.78rem;margin-top:4px;">⚠️ 如留空，必须在9月1日前在个人设置中填写班级，否则账户将被暂停发帖功能。</p>
      </div>
    </div>
    </div>

    <div id="external-fields" style="display:none;">
      <label class="form-label">用户名 <span class="form-required">*</span></label>
      <input type="text" id="ext_username" class="form-input" placeholder="设置你的用户名" maxlength="50" autocomplete="username">
      <label class="form-label">学校 <span class="form-hint">（可选）</span></label>
      <input type="text" id="ext_school" class="form-input" placeholder="如 华二普陀（外校同学可不填）" maxlength="50">
    </div>

    <label class="form-label">姓名 <span class="form-required">*</span></label>
    <input type="text" id="name" class="form-input" placeholder="真实姓名" maxlength="50" autocomplete="name">

    <label class="form-label">显示昵称 <span class="form-hint">（可选，公开显示的昵称）</span></label>
    <input type="text" id="nickname" class="form-input" placeholder="留空则显示真实姓名" maxlength="50">

    <label class="form-label">密码 <span class="form-required">*</span></label>
    <input type="password" id="password" class="form-input" placeholder="至少4个字符" autocomplete="new-password">

    <label class="form-label">确认密码 <span class="form-required">*</span></label>
    <input type="password" id="password2" class="form-input" placeholder="再次输入密码" autocomplete="new-password">

    <label style="display:flex;align-items:flex-start;gap:8px;margin:12px 0;font-size:0.8rem;cursor:pointer;line-height:1.5;">
      <input type="checkbox" id="agree-terms" onchange="updateSubmitState()" style="margin-top:3px;accent-color:var(--accent);">
      <span>我已阅读并同意 <a href="/terms" target="_blank" style="color:var(--accent);text-decoration:underline;">《社区规则协议》</a>（含隐私保护与处理规则）</span>
    </label>
    <label style="display:flex;align-items:flex-start;gap:8px;margin:0 0 12px;font-size:0.8rem;cursor:pointer;line-height:1.5;">
      <input type="checkbox" id="agree-data" onchange="updateSubmitState()" style="margin-top:3px;accent-color:var(--accent);">
      <span>我已了解并同意 <a href="/terms#data-notice" target="_blank" style="color:var(--accent);text-decoration:underline;">数据存储地告知</a>：我的信息将存储于境外服务器（《个人信息保护法》第39条）</span>
    </label>

    <div id="error" class="form-error" style="display:none;"></div>

    <button class="btn btn-primary btn-full" onclick="handleRegister()" id="submit-btn" disabled>注册</button>

    <div style="text-align:center;margin:14px 0 4px;">
      <button class="btn btn-link" onclick="toggleExternalMode()" id="ext-toggle-btn" style="font-size:0.85rem;">🎓 外校生？点此切换注册方式</button>
    </div>

    <div class="auth-links">
      <a href="/login">已有账号？登录</a>
      <span>|</span>
      <a href="/appeal">申诉</a>
      <span>|</span>
      <a href="/">返回首页</a>
    </div>
  </div>

  <script>
    // 注册后回跳地址(登录门禁用;默认回首页)
    function afterLoginUrl() {
      const n = new URLSearchParams(location.search).get('next');
      return (n && n.startsWith('/') && !n.startsWith('//')) ? n : '/';
    }
    // Redirect if already logged in (token is an httpOnly cookie)
    (function() {
      fetch('/api/auth/me')
        .then(r => r.ok ? window.location.href = afterLoginUrl() : null)
        .catch(() => {});
    })();

    function updateSubmitState() {
      const ok = document.getElementById('agree-terms').checked && document.getElementById('agree-data').checked;
      document.getElementById('submit-btn').disabled = !ok;
    }

    let externalMode = false;
    function toggleExternalMode() {
      externalMode = !externalMode;
      document.getElementById('internal-fields').style.display = externalMode ? 'none' : '';
      document.getElementById('external-fields').style.display = externalMode ? '' : 'none';
      document.getElementById('ext-toggle-btn').textContent = externalMode ? '🏫 我是本校学生？点此切换' : '🎓 外校生？点此切换注册方式';
      updateSubmitState();
    }

    async function handleRegister() {
      const year = document.getElementById('year').value.trim();
      const class_number = document.getElementById('class_number').value.trim();
      const name = externalMode ? document.getElementById('ext_username').value.trim() : document.getElementById('name').value.trim();
      const nickname = document.getElementById('nickname').value.trim();
      const school = document.getElementById('ext_school').value.trim();
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      const errorEl = document.getElementById('error');
      const btn = document.getElementById('submit-btn');

      errorEl.style.display = 'none';

      if (!name || !password) {
        errorEl.textContent = '请填写所有必填字段';
        errorEl.style.display = 'block';
        return;
      }

      if (!externalMode && !year) {
        errorEl.textContent = '请填写届';
        errorEl.style.display = 'block';
        return;
      }

      if (password.length < 4) {
        errorEl.textContent = '密码至少需要4个字符';
        errorEl.style.display = 'block';
        return;
      }

      if (password !== password2) {
        errorEl.textContent = '两次密码输入不一致';
        errorEl.style.display = 'block';
        return;
      }

      if (!document.getElementById('agree-terms').checked) {
        errorEl.textContent = '请先阅读并同意《社区规则协议》';
        errorEl.style.display = 'block';
        return;
      }

      if (!document.getElementById('agree-data').checked) {
        errorEl.textContent = '请阅读并同意数据存储地告知';
        errorEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = '注册中...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(externalMode ? {
            name: name,
            password: password,
            agree: true,
            data_consent: true,
            is_external: true,
            school: school
          } : {
            year: parseInt(year),
            class_number: class_number ? parseInt(class_number) : 0,
            name: name,
            nickname: nickname,
            password: password,
            agree: true,
            data_consent: true
          })
        });

        const data = await res.json();

        if (!res.ok) {
          if (data.canAppeal) {
            errorEl.innerHTML = `${data.error}<br><a href="/appeal" style="color:var(--accent);">点击此处申诉</a>`;
          } else {
            errorEl.textContent = data.error || '注册失败';
          }
          errorEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = '注册';
          return;
        }

        // Auto-login after registration (token is in httpOnly cookie)
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = afterLoginUrl();
      } catch (err) {
        errorEl.textContent = '网络错误，请重试';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = '注册';
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleRegister();
    });
  </script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{});});}</script>
</body>
</html>
